<header class="app-header">
  <div class="app-header__side app-header__side--start">
    <button *ngIf="showBack" type="button" class="app-header__back" (click)="goBack()" aria-label="Volver">
      <fa-icon [icon]="faChevronLeft" aria-hidden="true"></fa-icon>
    </button>
  </div>

  <div class="app-header__brand-wrap">
    <img class="app-header__brand" src="assets/images/ekko-logo-small.png" alt="Ekko" width="344" height="119" decoding="async" />
  </div>

  <div class="app-header__side app-header__side--end">
    <ng-content select="[header-end]"></ng-content>
  </div>
</header>
