<nav
  aria-label="Navegacion principal"
  class="fixed inset-x-0 bottom-0 z-10 grid w-full grid-cols-5 items-center rounded-t-[20px] border border-slate-700/55 bg-[#2f3033] px-[max(8px,calc(var(--screen-padding)-8px))] pt-2 pb-[calc(12px+var(--safe-bottom))] shadow-[0_20px_25px_-12px_rgba(0,0,0,0.22)] min-[520px]:mx-auto min-[520px]:max-w-[520px]"
>
  <a
    routerLink="/home"
    class="group flex cursor-pointer flex-col items-center justify-center gap-1.5 text-xs transition-all duration-200 ease-out hover:-translate-y-[3px] hover:text-white active:scale-95"
    [ngClass]="activeTab === 'home' ? 'text-[#d6be8a]' : 'text-[#9aa0a6]'"
  >
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="h-6 w-6 transition-all duration-200 ease-out group-hover:scale-110">
      <path
        d="M2.25 12 11.204 3.046a1.125 1.125 0 0 1 1.592 0L21.75 12M4.5 9.75V19.5A1.5 1.5 0 0 0 6 21h3.75v-5.25A1.5 1.5 0 0 1 11.25 14.25h1.5a1.5 1.5 0 0 1 1.5 1.5V21H18a1.5 1.5 0 0 0 1.5-1.5V9.75"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <span>Inicio</span>
  </a>

  <a
    href="javascript:void(0)"
    class="group flex cursor-pointer flex-col items-center justify-center gap-1.5 text-xs transition-all duration-200 ease-out hover:-translate-y-[3px] hover:text-white active:scale-95"
    [ngClass]="activeTab === 'discover' ? 'text-[#d6be8a]' : 'text-[#9aa0a6]'"
  >
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="h-6 w-6 transition-all duration-200 ease-out group-hover:scale-110">
      <path
        d="M12 3.75a8.25 8.25 0 1 0 8.25 8.25M12 3.75v8.25l5.835 5.835"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <span>Descubrir</span>
  </a>

  <button
    type="button"
    aria-label="Publicar"
    (click)="openPublish()"
    class="group flex h-[42px] w-[42px] items-center justify-center justify-self-center rounded-full bg-[#d6be8a] text-[#151515] transition-all duration-200 ease-out hover:-translate-y-1 hover:scale-110 hover:bg-[#c2a86f] hover:shadow-[0_12px_24px_rgba(0,0,0,0.45)] active:scale-95"
  >
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="h-5 w-5 transition-all duration-200 ease-out group-hover:scale-110">
      <path
        d="M12 4.5v15m7.5-7.5h-15"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  <a
    href="javascript:void(0)"
    class="group flex cursor-pointer flex-col items-center justify-center gap-1.5 text-xs transition-all duration-200 ease-out hover:-translate-y-[3px] hover:text-white active:scale-95"
    [ngClass]="activeTab === 'library' ? 'text-[#d6be8a]' : 'text-[#9aa0a6]'"
  >
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="h-6 w-6 transition-all duration-200 ease-out group-hover:scale-110">
      <path
        d="M17.25 21 12 17.25 6.75 21V5.625A1.875 1.875 0 0 1 8.625 3.75h6.75a1.875 1.875 0 0 1 1.875 1.875V21Z"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <span>Librer&iacute;a</span>
  </a>

  <button
    type="button"
    (click)="openProfile()"
    class="group flex cursor-pointer flex-col items-center justify-center gap-1.5 border-0 bg-transparent text-xs transition-all duration-200 ease-out hover:-translate-y-[3px] hover:text-white active:scale-95"
    [ngClass]="activeTab === 'profile' ? 'text-[#d6be8a]' : 'text-[#9aa0a6]'"
  >
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="h-6 w-6 transition-all duration-200 ease-out group-hover:scale-110">
      <path
        d="M15.75 6.75a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a8.966 8.966 0 0 1 14.998 0"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <span>Perfil</span>
  </button>
</nav>
