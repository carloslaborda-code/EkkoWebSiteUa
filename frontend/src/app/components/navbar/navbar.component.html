<nav
  aria-label="Navegacion principal"
  class="group/nav fixed inset-x-0 bottom-0 z-10 mx-auto grid w-full max-w-[var(--app-tablet-width)] grid-cols-5 items-center rounded-t-[20px] border border-slate-700/55 bg-[#2f3033]/95 px-[max(8px,calc(var(--screen-padding)-8px))] pt-2 pb-[calc(12px+var(--safe-bottom))] shadow-[0_20px_25px_-12px_rgba(0,0,0,0.22)] backdrop-blur md:left-4 md:right-4 md:bottom-4 md:rounded-[24px] lg:inset-x-auto lg:bottom-6 lg:left-6 lg:top-6 lg:flex lg:w-[82px] lg:max-w-none lg:flex-col lg:items-stretch lg:gap-2 lg:overflow-hidden lg:rounded-[30px] lg:px-3 lg:py-4 lg:transition-[width] lg:duration-300 lg:hover:w-[var(--desktop-sidebar-width)]"
>
  <div class="hidden lg:flex lg:min-h-[68px] lg:items-center lg:px-3 lg:overflow-hidden">
    <span class="text-[1.9rem] font-light tracking-tight text-white lg:whitespace-nowrap lg:opacity-0 lg:transition-opacity lg:duration-200 lg:group-hover/nav:opacity-100">ekko</span>
  </div>

  <a
    routerLink="/home"
    class="group flex cursor-pointer flex-col items-center justify-center gap-1.5 text-xs transition-all duration-200 ease-out hover:text-white active:scale-95 lg:min-h-[58px] lg:flex-row lg:justify-start lg:gap-4 lg:rounded-2xl lg:px-4 lg:py-3 lg:text-[0.95rem] lg:hover:bg-white/5 lg:hover:translate-x-1"
    [ngClass]="activeTab === 'home' ? 'text-[#d6be8a] lg:bg-white/5' : 'text-[#9aa0a6]'"
  >
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="h-6 w-6 lg:h-7 lg:w-7 lg:flex-none">
      <path
        d="M2.25 12 11.204 3.046a1.125 1.125 0 0 1 1.592 0L21.75 12M4.5 9.75V19.5A1.5 1.5 0 0 0 6 21h3.75v-5.25A1.5 1.5 0 0 1 11.25 14.25h1.5a1.5 1.5 0 0 1 1.5 1.5V21H18a1.5 1.5 0 0 0 1.5-1.5V9.75"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <span class="lg:max-w-0 lg:overflow-hidden lg:whitespace-nowrap lg:opacity-0 lg:transition-all lg:duration-200 lg:group-hover/nav:max-w-[120px] lg:group-hover/nav:opacity-100">Inicio</span>
  </a>

  <button
    type="button"
    (click)="openDiscover()"
    class="group flex cursor-pointer flex-col items-center justify-center gap-1.5 text-xs transition-all duration-200 ease-out hover:text-white active:scale-95 lg:min-h-[58px] lg:flex-row lg:justify-start lg:gap-4 lg:rounded-2xl lg:px-4 lg:py-3 lg:text-[0.95rem] lg:hover:bg-white/5 lg:hover:translate-x-1"
    [ngClass]="activeTab === 'discover' ? 'text-[#d6be8a] lg:bg-white/5' : 'text-[#9aa0a6]'"
  >
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="h-6 w-6 lg:h-7 lg:w-7 lg:flex-none">
      <path
        d="M12 3.75a8.25 8.25 0 1 0 8.25 8.25M12 3.75v8.25l5.835 5.835"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <span class="lg:max-w-0 lg:overflow-hidden lg:whitespace-nowrap lg:opacity-0 lg:transition-all lg:duration-200 lg:group-hover/nav:max-w-[120px] lg:group-hover/nav:opacity-100">Descubrir</span>
  </button>

  <button
    type="button"
    aria-label="Publicar"
    (click)="openPublish()"
    class="group flex h-[42px] w-[42px] items-center justify-center justify-self-center rounded-full bg-[#d6be8a] text-[#151515] transition-all duration-200 ease-out hover:bg-[#c2a86f] active:scale-95 lg:mt-1 lg:h-auto lg:w-full lg:justify-start lg:gap-4 lg:self-auto lg:rounded-2xl lg:px-4 lg:py-3 lg:hover:translate-x-1 lg:hover:shadow-[0_12px_24px_rgba(0,0,0,0.35)]"
  >
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="h-5 w-5 lg:h-7 lg:w-7 lg:flex-none">
      <path
        d="M12 4.5v15m7.5-7.5h-15"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <span class="hidden text-[0.95rem] font-medium lg:inline lg:max-w-0 lg:overflow-hidden lg:whitespace-nowrap lg:opacity-0 lg:transition-all lg:duration-200 lg:group-hover/nav:max-w-[120px] lg:group-hover/nav:opacity-100">Publicar</span>
  </button>

  <a
    href="javascript:void(0)"
    class="group flex cursor-pointer flex-col items-center justify-center gap-1.5 text-xs transition-all duration-200 ease-out hover:text-white active:scale-95 lg:min-h-[58px] lg:flex-row lg:justify-start lg:gap-4 lg:rounded-2xl lg:px-4 lg:py-3 lg:text-[0.95rem] lg:hover:bg-white/5 lg:hover:translate-x-1"
    [ngClass]="activeTab === 'library' ? 'text-[#d6be8a] lg:bg-white/5' : 'text-[#9aa0a6]'"
  >
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="h-6 w-6 lg:h-7 lg:w-7 lg:flex-none">
      <path
        d="M17.25 21 12 17.25 6.75 21V5.625A1.875 1.875 0 0 1 8.625 3.75h6.75a1.875 1.875 0 0 1 1.875 1.875V21Z"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <span class="lg:max-w-0 lg:overflow-hidden lg:whitespace-nowrap lg:opacity-0 lg:transition-all lg:duration-200 lg:group-hover/nav:max-w-[120px] lg:group-hover/nav:opacity-100">Librer&iacute;a</span>
  </a>

  <button
    type="button"
    (click)="openProfile()"
    class="group flex cursor-pointer flex-col items-center justify-center gap-1.5 border-0 bg-transparent text-xs transition-all duration-200 ease-out hover:text-white active:scale-95 lg:mt-auto lg:min-h-[58px] lg:flex-row lg:justify-start lg:gap-4 lg:rounded-2xl lg:px-4 lg:py-3 lg:text-[0.95rem] lg:hover:bg-white/5 lg:hover:translate-x-1"
    [ngClass]="activeTab === 'profile' ? 'text-[#d6be8a] lg:bg-white/5' : 'text-[#9aa0a6]'"
  >
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="h-6 w-6 lg:h-7 lg:w-7 lg:flex-none">
      <path
        d="M15.75 6.75a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a8.966 8.966 0 0 1 14.998 0"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <span class="lg:max-w-0 lg:overflow-hidden lg:whitespace-nowrap lg:opacity-0 lg:transition-all lg:duration-200 lg:group-hover/nav:max-w-[120px] lg:group-hover/nav:opacity-100">Perfil</span>
  </button>
</nav>
