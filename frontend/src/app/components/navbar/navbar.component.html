<nav aria-label="Navegacion principal"
  class="group/nav fixed inset-x-0 bottom-0 z-10 mx-auto grid w-full max-w-[var(--app-tablet-width)] grid-cols-5 items-center rounded-t-[20px] border border-slate-700/55 bg-[#2f3033]/95 px-[max(8px,calc(var(--screen-padding)-8px))] pt-2 pb-[calc(12px+var(--safe-bottom))] shadow-[0_20px_25px_-12px_rgba(0,0,0,0.22)] backdrop-blur md:left-4 md:right-4 md:bottom-4 md:rounded-[24px] lg:inset-x-auto lg:bottom-6 lg:left-6 lg:top-6 lg:flex lg:w-[82px] lg:max-w-none lg:flex-col lg:items-stretch lg:gap-2 lg:overflow-hidden lg:rounded-[30px] lg:px-3 lg:py-4 lg:transition-[width] lg:duration-300 lg:hover:w-[var(--desktop-sidebar-width)]">
  <a class="hidden lg:flex lg:min-h-[68px] lg:items-center lg:px-3 lg:overflow-hidden cursor-pointer"
    [routerLink]="['/home']">
    <span
      class="text-[1.9rem] font-light tracking-tight text-white lg:whitespace-nowrap lg:opacity-0 lg:transition-opacity lg:duration-200 lg:group-hover/nav:opacity-100">
      ekko
    </span>
  </a>

  <button type="button" (click)="openHome()" [attr.aria-current]="activeTab === 'home' ? 'page' : null"
    class="order-2 group flex cursor-pointer flex-col items-center justify-center gap-1.5 text-xs transition-all duration-200 ease-out hover:text-white active:scale-95 lg:order-none lg:min-h-[58px] lg:flex-row lg:justify-start lg:gap-4 lg:rounded-2xl lg:px-4 lg:py-3 lg:text-[0.95rem] lg:hover:bg-white/5 lg:hover:translate-x-1"
    [ngClass]="activeTab === 'home' ? 'text-[#d6be8a] lg:bg-[#d6be8a] lg:text-[#151515] lg:hover:bg-[#c2a86f]' : 'text-[#9aa0a6]'">
    <fa-icon [icon]="faHouseSolid" aria-hidden="true" class="navbar-icon lg:flex-none"></fa-icon>
    <span
      class="lg:max-w-0 lg:overflow-hidden lg:whitespace-nowrap lg:opacity-0 lg:transition-all lg:duration-200 lg:group-hover/nav:max-w-[120px] lg:group-hover/nav:opacity-100">Inicio</span>
  </button>

  <button type="button" (click)="openDiscover()" [attr.aria-current]="activeTab === 'discover' ? 'page' : null"
    class="order-2 group flex cursor-pointer flex-col items-center justify-center gap-1.5 text-xs transition-all duration-200 ease-out hover:text-white active:scale-95 lg:order-none lg:min-h-[58px] lg:flex-row lg:justify-start lg:gap-4 lg:rounded-2xl lg:px-4 lg:py-3 lg:text-[0.95rem] lg:hover:bg-white/5 lg:hover:translate-x-1"
    [ngClass]="activeTab === 'discover' ? 'text-[#d6be8a] lg:bg-[#d6be8a] lg:text-[#151515] lg:hover:bg-[#c2a86f]' : 'text-[#9aa0a6]'">
    <fa-icon [icon]="activeTab === 'discover' ? faCompassSolid : faCompassRegular" aria-hidden="true"
      class="navbar-icon lg:flex-none"></fa-icon>
    <span
      class="lg:max-w-0 lg:overflow-hidden lg:whitespace-nowrap lg:opacity-0 lg:transition-all lg:duration-200 lg:group-hover/nav:max-w-[120px] lg:group-hover/nav:opacity-100">Descubrir</span>
  </button>

  <button type="button" aria-label="Libreria" (click)="openLibrary()"
    [attr.aria-current]="activeTab === 'library' ? 'page' : null"
    class="order-4 group flex cursor-pointer flex-col items-center justify-center gap-1.5 text-xs transition-all duration-200 ease-out hover:text-white active:scale-95 lg:order-none lg:min-h-[58px] lg:flex-row lg:justify-start lg:gap-4 lg:rounded-2xl lg:px-4 lg:py-3 lg:text-[0.95rem] lg:hover:bg-white/5 lg:hover:translate-x-1"
    [ngClass]="activeTab === 'library' ? 'text-[#d6be8a] lg:bg-[#d6be8a] lg:text-[#151515] lg:hover:bg-[#c2a86f]' : 'text-[#9aa0a6]'">
    <fa-icon [icon]="activeTab === 'library' ? faBookmarkSolid : faBookmarkRegular" aria-hidden="true"
      class="navbar-icon lg:flex-none"></fa-icon>
    <span
      class="lg:max-w-0 lg:overflow-hidden lg:whitespace-nowrap lg:opacity-0 lg:transition-all lg:duration-200 lg:group-hover/nav:max-w-[120px] lg:group-hover/nav:opacity-100">Librer&iacute;a</span>
  </button>

  <button type="button" aria-label="Publicar" (click)="openPublish()"
    [attr.aria-current]="activeTab === 'publish' ? 'page' : null"
    class="order-3 group flex h-[42px] w-[42px] items-center justify-center justify-self-center rounded-full border transition-all duration-200 ease-out active:scale-95 lg:order-none lg:min-h-[58px] lg:h-auto lg:w-full lg:flex-row lg:justify-start lg:gap-4 lg:self-auto lg:rounded-2xl lg:px-4 lg:py-3 lg:text-[0.95rem] lg:hover:translate-x-1"
    [ngClass]="activeTab === 'publish'
    ? 'border-[#d6be8a] bg-[#d6be8a] text-[#151515] lg:hover:bg-[#c2a86f]'
    : 'border-[#9aa0a6] bg-[#9aa0a6] text-black lg:hover:bg-white/5 lg:hover:text-white'">
    <fa-icon [icon]="faPlus" class="navbar-icon navbar-icon--publish lg:flex-none"></fa-icon>
    <span
      class="hidden text-[0.95rem] font-medium lg:inline lg:max-w-0 lg:overflow-hidden lg:whitespace-nowrap lg:opacity-0 lg:transition-all lg:duration-200 lg:group-hover/nav:max-w-[120px] lg:group-hover/nav:opacity-100">
      Publicar
    </span>
  </button>


  <button type="button" (click)="openProfile()" [attr.aria-current]="activeTab === 'profile' ? 'page' : null"
    class="order-5 group flex cursor-pointer flex-col items-center justify-center gap-1.5 border-0 bg-transparent text-xs transition-all duration-200 ease-out hover:text-white active:scale-95 lg:order-none lg:mt-auto lg:min-h-[58px] lg:flex-row lg:justify-start lg:gap-4 lg:rounded-2xl lg:px-4 lg:py-3 lg:text-[0.95rem] lg:hover:bg-white/5 lg:hover:translate-x-1"
    [ngClass]="activeTab === 'profile' ? 'text-[#d6be8a] lg:bg-[#d6be8a] lg:text-[#151515] lg:hover:bg-[#c2a86f]' : 'text-[#9aa0a6]'">
    <fa-icon [icon]="activeTab === 'profile' ? faUserSolid : faUserRegular" aria-hidden="true"
      class="navbar-icon lg:flex-none"></fa-icon>
    <span
      class="lg:max-w-0 lg:overflow-hidden lg:whitespace-nowrap lg:opacity-0 lg:transition-all lg:duration-200 lg:group-hover/nav:max-w-[120px] lg:group-hover/nav:opacity-100">Perfil</span>
  </button>
</nav>
