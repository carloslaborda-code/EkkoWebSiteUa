<div class="home-shell">
  <div class="ambient ambient-left"></div>
  <div class="ambient ambient-top"></div>
  <div class="ambient ambient-right"></div>

  <main class="home-frame">
    <header class="home-header">
      <div class="brand-block">
        <p class="status-time">9:30</p>
        <div class="brand-row">
          <img class="brand-logo-image" src="assets/images/ekko-logo.png" alt="Ekko" />
        </div>
      </div>

      <a routerLink="/profile" class="icon-button icon-button--header" aria-label="Perfil">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="M4.5 19.5a8.5 8.5 0 0 1 15 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </a>
    </header>

    <section class="search-row">
      <label class="search-box" for="home-search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M11 19a8 8 0 1 1 5.3-14l.2.18A8 8 0 0 1 11 19Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="m20 20-3.5-3.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
        <input
          id="home-search"
          type="search"
          name="search"
          [(ngModel)]="searchTerm"
          (ngModelChange)="onSearchChange()"
          placeholder="Search for iconic lines..."
        />
      </label>

      <button type="button" class="icon-button filter-button" aria-label="Filtros">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M4 6h10M4 18h16M10 12h10"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <circle cx="17" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="1.8" />
          <circle cx="7" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="1.8" />
          <circle cx="13" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="1.8" />
        </svg>
      </button>
    </section>

    <section class="feed-section" aria-live="polite">
      <p *ngIf="loading" class="state-message">Loading featured lines...</p>
      <p *ngIf="!loading && !visibleQuotes.length" class="state-message">No lines found for that search.</p>

      <article
        *ngFor="let quote of visibleQuotes; trackBy: trackByQuoteId"
        class="quote-card"
        [class.quote-card--image]="quote.image"
        [class.quote-card--placeholder]="!quote.image"
      >
        <div
          class="quote-media"
          [style.background-image]="quote.image ? 'linear-gradient(180deg, rgba(15, 23, 42, 0.08), rgba(15, 23, 42, 0.82)), url(' + quote.image + ')' : null"
          [class.quote-media--placeholder]="!quote.image"
        >
          <div *ngIf="!quote.image" class="placeholder-mark">{{ quote.workTitle | slice:0:1 }}</div>
        </div>

        <div class="quote-content">
          <h2 class="quote-text">"{{ quote.text }}"</h2>

          <div class="quote-meta">
            <p class="quote-title">{{ quote.workTitle }} <span>({{ quote.year }})</span></p>

            <div class="quote-stats">
              <div class="stars" [attr.aria-label]="'Puntuacion ' + quote.rating + ' de 5'">
                <svg *ngFor="let filled of getStarArray(quote.rating)" viewBox="0 0 24 24" [class.star--muted]="!filled">
                  <path
                    d="m12 3.6 2.7 5.46 6.03.88-4.36 4.25 1.03 6-5.4-2.84-5.4 2.84 1.03-6L3.27 9.94l6.03-.88L12 3.6Z"
                    fill="currentColor"
                  />
                </svg>
                <span>{{ quote.rating.toFixed(1) }}</span>
              </div>

              <div class="views">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <circle cx="12" cy="12" r="2.7" fill="none" stroke="currentColor" stroke-width="1.7" />
                </svg>
                <span>{{ quote.views }}</span>
              </div>
            </div>

            <button type="button" class="play-button" [attr.aria-label]="'Play ' + quote.workTitle">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 6.5v11l9-5.5-9-5.5Z" fill="currentColor" />
              </svg>
            </button>
          </div>
        </div>
      </article>
    </section>

    <nav class="bottom-nav" aria-label="Navegacion principal">
      <a class="nav-item nav-item--active" routerLink="/home">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 10.5 12 4l8 6.5V20h-5.5v-5h-5V20H4v-9.5Z" fill="currentColor" />
        </svg>
        <span>Inicio</span>
      </a>
      <a class="nav-item" href="javascript:void(0)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 3.8a8.2 8.2 0 1 0 8.2 8.2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <path
            d="M20.2 3.8 13.5 10.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <circle cx="12" cy="12" r="2.5" fill="currentColor" />
        </svg>
        <span>Descubrir</span>
      </a>
      <a class="nav-item nav-item--accent" href="javascript:void(0)" aria-label="Publicar">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
        </svg>
      </a>
      <a class="nav-item" href="javascript:void(0)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M7 4.5h10a1.5 1.5 0 0 1 1.5 1.5v14l-6.5-3-6.5 3V6A1.5 1.5 0 0 1 7 4.5Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
        </svg>
        <span>Libreria</span>
      </a>
      <a class="nav-item" routerLink="/profile">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path
            d="M4.5 19.5a8.5 8.5 0 0 1 15 0"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
        <span>Perfil</span>
      </a>
    </nav>
  </main>
</div>
