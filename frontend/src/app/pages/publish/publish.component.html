<div class="publish-shell">
  <div class="glow glow-left"></div>
  <div class="glow glow-top"></div>
  <div class="glow glow-right"></div>

  <main class="publish-frame">
    <header class="publish-header">
      <button type="button" class="back-link" (click)="router.navigate(['/home'])" aria-label="Volver">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <img class="brand-logo-image" src="assets/images/ekko-logo.png" alt="Ekko" />
      <div class="header-space"></div>
    </header>

    <section class="publish-body">
      <div class="section-head">
        <h2>FORMATO</h2>
      </div>

      <div class="format-switch">
        <button type="button" class="format-option" [class.format-option--active]="mediaType === 'audio'" (click)="setMediaType('audio')">
          Audio
        </button>
        <button type="button" class="format-option" [class.format-option--active]="mediaType === 'video'" (click)="setMediaType('video')">
          Video
        </button>
      </div>

      <label class="upload-dropzone">
        <input type="file" [accept]="acceptTypes" (change)="onFileChange($event)" hidden />
        <span class="upload-icon">&#8679;</span>
        <strong>Subir fragmento</strong>
        <span>{{ mediaType === 'audio' ? 'MP3 hasta 50MB' : 'MP4 o MOV hasta 50MB' }}</span>
        <span class="upload-button">Buscar archivo</span>
        <small *ngIf="selectedFileName">{{ selectedFileName }}</small>
      </label>

      <div class="section-head">
        <h2>LA CITA / FRAGMENTO</h2>
      </div>
      <textarea [(ngModel)]="quoteText" rows="4" placeholder='Ej.: "Los ojos, chico. Nunca mienten."'></textarea>

      <div class="section-head">
        <h2>CATEGOR&Iacute;A</h2>
      </div>
      <div class="category-row">
        <button
          type="button"
          class="category-chip"
          *ngFor="let option of categories"
          [class.category-chip--active]="category === option.value"
          (click)="category = option.value"
        >
          {{ option.label }}
        </button>
      </div>

      <div class="form-grid">
        <label class="field">
          <span>T&Iacute;TULO DE LA PRODUCCI&Oacute;N</span>
          <input type="text" [(ngModel)]="workTitle" />
        </label>
        <label class="field field--small">
          <span>A&Ntilde;O</span>
          <input type="number" [(ngModel)]="year" />
        </label>
      </div>

      <div class="form-grid">
        <label class="field">
          <span>ACTOR</span>
          <input type="text" [(ngModel)]="actorName" />
        </label>
        <label class="field">
          <span>PERSONAJE</span>
          <input type="text" [(ngModel)]="characterName" />
        </label>
      </div>

      <label class="field">
        <span>SINOPSIS</span>
        <textarea [(ngModel)]="synopsis" rows="5" placeholder="Describe brevemente el contexto del fragmento..."></textarea>
      </label>

      <label class="field">
        <span>ETIQUETAS</span>
        <input type="text" [(ngModel)]="hashtagsText" placeholder="crimen, drama, iconico, cine80s" />
      </label>

      <div class="meta-row">
        <div class="meta-pill">
          <span>DURACI&Oacute;N</span>
          <strong>{{ duration }}</strong>
        </div>
        <div class="meta-pill">
          <span>TIPO</span>
          <strong>{{ mediaType === 'audio' ? 'AUDIO' : 'VIDEO' }}</strong>
        </div>
      </div>

      <p *ngIf="message" class="publish-message">{{ message }}</p>

      <button type="button" class="publish-button" (click)="publish()" [disabled]="submitting">
        {{ submitting ? 'Publicando...' : 'PUBLICAR CONTENIDO' }}
      </button>
    </section>

    <app-navbar activeTab="publish"></app-navbar>
  </main>
</div>
