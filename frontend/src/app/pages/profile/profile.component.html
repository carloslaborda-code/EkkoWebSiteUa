<div class="profile-shell" [class.profile-shell--contrast]="profile?.settings?.highContrast">
  <div class="glow glow-left" aria-hidden="true"></div>
  <div class="glow glow-top" aria-hidden="true"></div>
  <div class="glow glow-right" aria-hidden="true"></div>

  <main id="main-content" class="profile-frame" tabindex="-1">
    <app-header class="profile-topbar">
      <a header-end routerLink="/settings" class="icon-button icon-button--header" aria-label="Ajustes">
        <fa-icon [icon]="faGear" aria-hidden="true"></fa-icon>
      </a>
    </app-header>

    <section class="profile-body" *ngIf="profile; else loadingState">
      <aside class="profile-overview">
        <ng-container [ngSwitch]="activeOverviewLayout">
          <app-profile-overview-original
            *ngSwitchCase="'original'"
            [profile]="profile"
            [initials]="initials"
            [avatarSaving]="avatarSaving"
            [avatarMessage]="avatarMessage"
            [avatarError]="avatarError"
            (avatarSelected)="onAvatarChange($event)"
          ></app-profile-overview-original>

          <app-profile-overview-instagram
            *ngSwitchCase="'instagram'"
            [profile]="profile"
            [initials]="initials"
            [avatarSaving]="avatarSaving"
            [avatarMessage]="avatarMessage"
            [avatarError]="avatarError"
            (avatarSelected)="onAvatarChange($event)"
          ></app-profile-overview-instagram>

          <app-profile-overview-compact
            *ngSwitchDefault
            [profile]="profile"
            [initials]="initials"
            [avatarSaving]="avatarSaving"
            [avatarMessage]="avatarMessage"
            [avatarError]="avatarError"
            (avatarSelected)="onAvatarChange($event)"
          ></app-profile-overview-compact>
        </ng-container>
      </aside>

      <div class="profile-library">
        <section class="uploads-section">
          <h2>Mis Subidas</h2>
          <div class="uploads-grid" *ngIf="profile.uploads?.length; else emptyUploadsState">
            <article class="upload-card" *ngFor="let upload of profile.uploads; trackBy: trackByUploadTitle">
              <div class="upload-art" [class.upload-art--wave]="upload.type === 'audio'" [class.upload-art--mic]="upload.type === 'voice'" [class.upload-art--console]="upload.type === 'sfx'">
                <img *ngIf="upload.image" [src]="upload.image" [alt]="upload.title" class="upload-image" width="320" height="320" loading="lazy" decoding="async" />
                <div class="wave-bars" *ngIf="upload.type === 'audio' && !upload.image">
                  <span></span><span></span><span></span><span></span><span></span>
                </div>
                <div class="mic-shape" *ngIf="upload.type === 'voice' && !upload.image"></div>
                <div class="console-shape" *ngIf="upload.type === 'sfx' && !upload.image"></div>
              </div>
              <p>{{ upload.title }}</p>
            </article>
          </div>
          <ng-template #emptyUploadsState>
            <p class="empty-state">Todav&iacute;a no has subido contenido.</p>
          </ng-template>
        </section>
      </div>
    </section>

    <ng-template #loadingState>
      <p class="empty-state">Cargando perfil...</p>
    </ng-template>

    <app-navbar activeTab="profile"></app-navbar>
  </main>
</div>
