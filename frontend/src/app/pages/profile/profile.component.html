<div class="profile-shell" [class.profile-shell--contrast]="profile?.settings?.highContrast">
  <div class="glow glow-left" aria-hidden="true"></div>
  <div class="glow glow-top" aria-hidden="true"></div>
  <div class="glow glow-right" aria-hidden="true"></div>

  <main id="main-content" class="profile-frame" tabindex="-1">
    <header class="profile-topbar">
      <a routerLink="/settings" class="settings-link" aria-label="Ajustes">
        <app-icon name="cog-6-tooth" className="h-5 w-5"></app-icon>
      </a>
    </header>

    <section class="profile-body" *ngIf="profile; else loadingState">
      <aside class="profile-overview">
        <div class="avatar-wrap">
          <input
            #avatarInput
            type="file"
            accept="image/*"
            class="avatar-input"
            (change)="onAvatarChange($event)"
          />
          <div class="avatar-ring">
            <img *ngIf="profile.avatar" [src]="profile.avatar" [alt]="profile.username" class="avatar-image" decoding="async" />
            <div *ngIf="!profile.avatar" class="avatar-fallback">{{ initials }}</div>
          </div>
          <button
            type="button"
            class="avatar-edit"
            aria-label="Editar foto de perfil"
            [disabled]="avatarSaving"
            (click)="avatarInput.click()"
          >
            <app-icon name="pencil-square" className="h-3.5 w-3.5"></app-icon>
          </button>
        </div>
        <p class="avatar-message" *ngIf="avatarMessage" [class.avatar-message--error]="avatarError">{{ avatarMessage }}</p>

        <div class="identity">
          <h1>{{ profile.username }}</h1>
          <p>@{{ profile.username.toLowerCase().replace(' ', '_') }}_ekko</p>
        </div>

        <section class="stats-grid">
          <article class="stat-card">
            <strong>{{ profile.uploadsCount }}</strong>
            <span>SUBIDAS</span>
          </article>
          <article class="stat-card">
            <strong>{{ profile.downloads }}</strong>
            <span>DESCARGAS</span>
          </article>
        </section>
      </aside>

      <div class="profile-library">
        <section class="uploads-section">
          <h2>Mis Subidas</h2>
          <div class="uploads-grid" *ngIf="profile.uploads?.length; else emptyUploadsState">
            <article class="upload-card" *ngFor="let upload of profile.uploads; trackBy: trackByUploadTitle">
              <div class="upload-art" [class.upload-art--wave]="upload.type === 'audio'" [class.upload-art--mic]="upload.type === 'voice'" [class.upload-art--console]="upload.type === 'sfx'">
                <img *ngIf="upload.image" [src]="upload.image" [alt]="upload.title" class="upload-image" loading="lazy" decoding="async" />
                <div class="wave-bars" *ngIf="upload.type === 'audio' && !upload.image">
                  <span></span><span></span><span></span><span></span><span></span>
                </div>
                <div class="mic-shape" *ngIf="upload.type === 'voice' && !upload.image"></div>
                <div class="console-shape" *ngIf="upload.type === 'sfx' && !upload.image"></div>
              </div>
              <p>{{ upload.title }}</p>
            </article>
          </div>
          <ng-template #emptyUploadsState>
            <p class="empty-state">Todav&iacute;a no has subido contenido.</p>
          </ng-template>
        </section>
      </div>
    </section>

    <ng-template #loadingState>
      <p class="empty-state">Cargando perfil...</p>
    </ng-template>

    <app-navbar activeTab="profile"></app-navbar>
  </main>
</div>
